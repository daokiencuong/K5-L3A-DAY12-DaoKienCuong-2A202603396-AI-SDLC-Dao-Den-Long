<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đảo Đèn Lồng · Đêm 1</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090d1c;color:#fff;font:16px Nunito,system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;inset:0;pointer-events:none;padding:clamp(16px,3vw,34px);display:flex;justify-content:space-between;align-items:flex-start;text-shadow:0 2px 10px #080b19}.panel{background:#10182bbd;border:1px solid #ffffff20;border-radius:18px;padding:14px 18px;backdrop-filter:blur(8px);box-shadow:0 8px 30px #03040a70}.brand{font-size:12px;letter-spacing:.22em;color:#ffd48b;font-weight:900}.title{font-size:23px;font-weight:900}.stats{display:flex;gap:22px;margin-top:8px}.stat small{display:block;color:#aab5d3;font-size:11px;letter-spacing:.13em}.stat strong{font-size:20px}.right{text-align:right}.objective{color:#ffdc9d;font-weight:700;margin-top:8px}.bottom{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#e6e9f3cc;font-size:13px;background:#10182bbd;padding:10px 16px;border-radius:99px}.overlay{position:fixed;inset:0;background:#070a15b8;display:none;place-items:center;text-align:center}.card{padding:34px 48px;border-radius:24px;background:#141c31;border:1px solid #ffffff24}.card h1{font-size:42px;margin:0 0 6px}.card button{margin-top:14px;border:0;border-radius:99px;padding:12px 25px;background:#ffca75;color:#30200c;font:900 16px Nunito;pointer-events:auto;cursor:pointer}
</style></head><body><canvas id="game"></canvas>
<div class="hud"><div class="panel"><div class="brand">ĐÊM 1 · ĐẢO BẾN</div><div class="title">Đảo Đèn Lồng</div><div class="stats"><div class="stat"><small>ÁNH SÁNG</small><strong id="light">✦ 0 / 5</strong></div><div class="stat"><small>ĐIỂM</small><strong id="score">0</strong></div><div class="stat"><small>ĐÈN SINH MỆNH</small><strong id="flames">♥ ♥ ♥</strong></div></div></div><div class="panel right"><div class="brand">SƯƠNG TAN LÚC</div><div class="title" id="clock">05:00</div><div class="objective" id="carry">Tìm đom đóm trên đảo</div></div></div>
<div class="bottom">WASD di chuyển · Space nhảy · E thắp đèn · Q tỏa sáng · Kéo chuột để xoay góc nhìn</div>
<div class="overlay" id="overlay"><div class="card"><div class="brand">ĐÊM 1 · ĐẢO BẾN</div><h1 id="result">Đảo đã sáng!</h1><div id="finalscore"></div><button onclick="location.reload()">Chơi lại</button></div></div>
<script src="game.js"></script></body></html>
